<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>窝事 · 快递原型</title>
<style>
:root{--bg:#f7f8f6;--panel:#fff;--ink:#1e2b26;--muted:#61716b;--line:#dce4de;--green:#266e50;--light:#eaf4ed;--orange:#a66021;--orange-light:#fbf0e2;--radius:14px}*{box-sizing:border-box}body{margin:0;background:#e9eeea;color:var(--ink);font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #88bea0;outline-offset:2px}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:16px}.brand{font-size:18px;font-weight:750;letter-spacing:-.02em}.brand b{color:var(--green)}.top small{color:var(--muted)}.switch{display:flex;gap:4px;padding:4px;background:#eef2ee;border-radius:11px}.switch button{border:0;background:transparent;padding:7px 16px;border-radius:8px;color:var(--muted)}.switch button.active{background:white;color:var(--ink);box-shadow:0 1px 4px #15251c19}.stage{min-height:calc(100vh - 64px);padding:28px}.web{max-width:1320px;margin:auto;min-height:720px;background:var(--panel);border:1px solid var(--line);border-radius:18px;display:grid;grid-template-columns:220px minmax(0,1fr);overflow:hidden;box-shadow:0 12px 40px #2d4e3812}.side{background:#f9fbf8;border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column}.side h2{font-size:18px;margin:0 10px 34px}.side .nav{width:100%;display:block;text-align:left;padding:12px 14px;border:0;border-radius:9px;background:transparent;color:var(--muted);margin:2px 0}.side .nav.active{background:var(--light);color:var(--green);font-weight:700}.side .foot{margin-top:auto;color:var(--muted);font-size:12px;padding:12px}.content{padding:28px 34px;min-width:0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.page-title{font-size:28px;letter-spacing:-.03em;margin:0}.sub{color:var(--muted);margin:5px 0 0}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:10px 16px;min-height:42px;font-weight:650}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.ghost{border:0;background:transparent}.btn.danger{color:#9a4934}.btn:disabled{opacity:.48;cursor:default}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 16px}.tabs{display:flex;gap:4px;background:#f1f4f0;padding:4px;border-radius:10px}.tabs button{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:7px 15px}.tabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px #172d1d15}.search{border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-width:210px;flex:1;max-width:330px;background:#fff}.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}.list-head,.list-row{display:grid;grid-template-columns:1.05fr 1.3fr .75fr .85fr .8fr;gap:10px;align-items:center;padding:14px 18px}.list-head{background:#fafbfa;color:var(--muted);font-size:12px;font-weight:700;border-bottom:1px solid var(--line)}.list-row{border-bottom:1px solid var(--line)}.list-row:last-child{border:0}.list-row:hover{background:#fbfdfb}.code{font-size:17px;font-weight:760;letter-spacing:.025em}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--orange-light);color:var(--orange)}.pill.done{background:var(--light);color:var(--green)}.link{background:none;border:0;color:var(--green);padding:3px 0;font-weight:650}.empty{text-align:center;color:var(--muted);padding:70px 20px}.mini-wrap{display:flex;justify-content:center}.phone{width:390px;height:844px;max-width:100%;background:var(--bg);border:8px solid #23302a;border-radius:42px;overflow:hidden;box-shadow:0 20px 55px #23392c2d}.phone-inner{height:100%;overflow-y:auto;position:relative}.phone-head{background:#fff;padding:26px 22px 18px;border-bottom:1px solid var(--line)}.phone-head .kicker{font-size:12px;color:var(--muted);margin:0 0 6px}.phone-head h1{font-size:26px;margin:0}.phone-body{padding:18px 18px 100px}.phone .toolbar{margin:4px 0 16px}.phone .tabs{width:100%}.phone .tabs button{flex:1}.pickup-card{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:12px;box-shadow:0 2px 7px #20362a08}.pickup-card .code{font-size:25px;margin:10px 0 3px}.pickup-card .address{font-weight:650;font-size:15px}.pickup-card .card-actions{display:flex;gap:8px;margin-top:14px}.pickup-card .card-actions .btn{flex:1;min-height:38px;padding:8px 10px}.meta{color:var(--muted);font-size:12px}.phone-bottom{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px 18px}.phone-bottom .btn{width:100%}.overlay{position:fixed;inset:0;background:#15241cb3;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{background:white;border-radius:18px;width:min(100%,480px);padding:28px;box-shadow:0 20px 70px #0003;max-height:90vh;overflow:auto}.modal h2{font-size:23px;margin:0 0 6px}.modal p{color:var(--muted);margin:0 0 22px}.field{display:block;font-weight:650;margin:14px 0}.field span{display:block;margin-bottom:7px}.field input,.field textarea{display:block;width:100%;border:1px solid #cdd8cf;border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink)}.field textarea{min-height:100px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.detail-line{border-bottom:1px solid var(--line);padding:12px 0}.detail-line small{display:block;color:var(--muted);font-size:12px}.detail-line strong{display:block;font-size:16px;margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}.detail-line strong.big{font-size:28px}.hint{background:#f4f8f4;border:1px solid var(--line);padding:12px;border-radius:9px;color:var(--muted);margin-top:18px}.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}.auth-box{width:min(100%,400px);background:white;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 12px 35px #253b2a0c}.auth-box h1{font-size:27px;margin:0 0 6px}.auth-box p{color:var(--muted);margin:0 0 24px}.auth-box .btn{width:100%;margin-top:9px}.note{font-size:12px;color:var(--muted);margin-top:18px!important}.denied{font-size:46px;font-weight:750;color:var(--orange);margin-bottom:8px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#20382a;color:#fff;padding:11px 18px;border-radius:10px;z-index:20;box-shadow:0 8px 30px #0003}.mobile-view .web{display:none}.web-view .mini-wrap{display:none}.mobile-view .stage{padding:25px 10px}@media(max-width:700px){.top{padding:0 12px}.top small{display:none}.stage{padding:12px}.web{display:block}.side{display:none}.content{padding:20px}.list-head{display:none}.list-row{grid-template-columns:1fr 1fr}.list-row>div:nth-child(4){display:none}.page-title{font-size:23px}}
.identity-card{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:12px}.identity-card.primary-id{border-color:#a4cbb2;background:#f6fbf7}.identity-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}.identity-value{font-size:17px;font-weight:750;overflow-wrap:anywhere;line-height:1.35}.primary-id .identity-value{font-size:23px}.identity-card .btn{margin-top:12px;min-height:36px;padding:6px 14px}.identity-help{color:var(--muted);margin:8px 0 20px}.identity-help strong{color:var(--ink)}.identity-alert{padding:11px 13px;background:var(--orange-light);border-radius:9px;color:var(--orange);margin-bottom:14px}.phone-head .logout{float:right;font-size:12px}
</style>
</head><body><div id="app"></div>
<script>
const sample=[{id:'p1',address:'南门丰巢柜',pickupCode:'A-2681',recipientName:'妈妈',rawInfo:'您的快递已放入南门丰巢柜，请凭取件码 A-2681 领取。',status:'PENDING',source:'SMS',createdAt:'今天 09:28'},{id:'p2',address:'小区东门驿站',pickupCode:'743-918',recipientName:'爸爸',rawInfo:'包裹已到小区东门驿站。',status:'PENDING',source:'MANUAL',createdAt:'昨天 17:42'},{id:'p3',address:'北门快递柜',pickupCode:'B-1056',recipientName:'我',rawInfo:'包裹已送至北门快递柜。',status:'DONE',source:'MANUAL',createdAt:'10月31日 14:05'}];
let data=JSON.parse(JSON.stringify(sample)), device='web', screen='list', modal=null, status='PENDING', query='', selected=null, toastText='';
const miniIdentityData={openid:'oDemoWoshiFamilyA2681',unionid:'uDemoFamilyUnion743918',originalId:'gh_a696f88a7ea0',appid:'wxce94463a6a805e99'};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showToast(s){toastText=s;render();setTimeout(()=>{toastText='';render()},2200)}
function nav(s){screen=s;modal=null;render()}
function setDevice(s){device=s;screen=s==='mini'?'identity':'login';modal=null;render()}
function filtered(){return data.filter(p=>p.status===status&&(!query||[p.address,p.pickupCode,p.recipientName].some(x=>x?.toLowerCase().includes(query.toLowerCase()))))}
function login(){screen='list';render()}
async function copyIdentity(key){const value=miniIdentityData[key];if(!value)return;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value)}else{const input=document.createElement('textarea');input.value=value;document.body.appendChild(input);input.select();if(!document.execCommand('copy'))throw Error('copy failed');input.remove()}showToast('已复制')}catch{showToast('复制失败，请长按身份手动复制')}}
function searchInput(el){const pos=el.selectionStart;query=el.value;render();const next=document.querySelector('.search');next?.focus();next?.setSelectionRange(pos,pos)}
function statusSet(s){status=s;render()}
function openDetail(id){selected=id;modal='detail';render()}
function done(id){let p=data.find(x=>x.id===id);if(p&&p.status!=='DONE'){p.status='DONE';p.doneAt='刚刚';showToast('已标记为已取件')}else render();modal=null;render()}
function byCode(){let value=$('#codeEntry')?.value.trim();if(!value)return showToast('请输入取件码');let matches=data.filter(x=>x.status==='PENDING'&&x.pickupCode===value);if(!matches.length)return showToast('没有匹配的待取快递');selected=matches[0].id;modal='confirmCode';render()}
function save(){let f=$('#pickupForm');let address=f.address.value.trim(),pickupCode=f.pickupCode.value.trim();if(!address||!pickupCode)return showToast('请填写地点和取件码');if(modal==='edit'){let p=data.find(x=>x.id===selected);Object.assign(p,{address,pickupCode,recipientName:f.recipientName.value.trim(),rawInfo:f.rawInfo.value.trim()});showToast('已保存修改')}else{data.unshift({id:'p'+Date.now(),address,pickupCode,recipientName:f.recipientName.value.trim(),rawInfo:f.rawInfo.value.trim(),status:'PENDING',source:'MANUAL',createdAt:'刚刚'});status='PENDING';showToast('已录入快递')}modal=null;render()}
function headerBar(){return `<header class="top"><div class="brand">jarvis <b>family</b> <small> · 快递功能原型</small></div><div class="switch"><button class="${device==='web'?'active':''}" onclick="setDevice('web')">Web 管理端</button><button class="${device==='mini'?'active':''}" onclick="setDevice('mini')">小程序端</button></div></header>`}
function auth(){let denied=screen==='denied';return `<div class="auth"><div class="auth-box">${denied?`<div class="denied">!</div><h1>暂时无法使用</h1><p>这个邮箱尚未加入家庭白名单。请联系家人管理员开通。</p><button class="btn" onclick="nav('login')">返回登录</button>`:`<div class="brand" style="margin-bottom:24px">jarvis <b>family</b></div><h1>家里的快递，一起照看</h1><p>登录后查看和管理家里的快递。</p><label class="field"><span>邮箱</span><input value="family@example.com" type="email"></label><label class="field"><span>密码</span><input type="password" value="12345678"></label><button class="btn primary" onclick="login()">登录 · 演示通过</button><button class="btn" onclick="nav('denied')">查看白名单拦截状态</button><p class="note">演示入口不会验证真实身份，也不会发送任何数据。</p>`}</div></div>`}
function identityRow(label,key,primary=false){const value=miniIdentityData[key];return `<div class="identity-card ${primary?'primary-id':''}"><div class="identity-label">${label}</div><div class="identity-value">${esc(value||'暂无')}</div><button class="btn" onclick="copyIdentity('${key}')" ${value?'':'disabled'}>复制</button></div>`}
function miniIdentity(){return `<div class="mini-wrap"><div class="phone"><div class="phone-inner"><div class="phone-head"><p class="kicker">窝事 · 微信小程序</p><h1>先确认你的身份</h1></div><div class="phone-body">${screen==='denied'?'<div class="identity-alert">当前身份尚未加入白名单，请先联系管理员。</div>':''}<p class="identity-help"><strong>把 openid 或 unionid 发给管理员加入白名单后再登录。</strong></p>${identityRow('openid','openid',true)}${identityRow('unionid','unionid',true)}${identityRow('原始 ID · 备查','originalId')}${identityRow('AppID · 备查','appid')}<p class="note">此处为虚构身份演示。正式版进入小程序时先用 wx.login 探测身份，不会因此创建登录会话。</p><button class="btn primary" style="width:100%" onclick="login()">微信登录 · 演示通过</button><button class="btn" style="width:100%;margin-top:8px" onclick="nav('denied')">查看白名单拦截状态</button></div></div></div></div>`}
function tabs(){return `<div class="tabs"><button class="${status==='PENDING'?'active':''}" onclick="statusSet('PENDING')">待取件</button><button class="${status==='DONE'?'active':''}" onclick="statusSet('DONE')">已取件</button></div>`}
function webList(){let rows=filtered().map(p=>`<div class="list-row"><div><button class="link code" onclick="openDetail('${p.id}')">${esc(p.pickupCode)}</button></div><div>${esc(p.address)}<div class="meta">${esc(p.recipientName||'未填写收件人')} · ${p.source==='SMS'?'短信自动':'手工录入'}</div></div><div><span class="pill ${p.status==='DONE'?'done':''}">${p.status==='DONE'?'已取件':'待取件'}</span></div><div class="meta">${esc(p.createdAt)}</div><div><button class="link" onclick="openDetail('${p.id}')">查看详情</button> ${p.status==='PENDING'?`<button class="link" onclick="done('${p.id}')">标记已取</button>`:''}</div></div>`).join('');return `<div class="web"><aside class="side"><h2>jarvis family</h2><button class="nav active" onclick="nav('list')">▦　快递</button><button class="nav" onclick="modal='sms';render()">✉　SMS 接入</button><button class="nav" onclick="modal='members';render()">♙　家庭成员</button><div class="foot">家庭空间 · 原型演示<br><button class="link" onclick="nav('login')">退出登录</button></div></aside><main class="content"><div class="row"><div><h1 class="page-title">快递</h1><p class="sub">把取件信息放在一起，谁顺路谁领取。</p></div><button class="btn primary" onclick="modal='create';render()">＋ 录入快递</button></div><div class="toolbar">${tabs()}<input class="search" aria-label="搜索快递" placeholder="搜索取件码、地点或收件人" value="${esc(query)}" oninput="searchInput(this)"><button class="btn" onclick="modal='code';render()">按取件码完成</button></div><div class="list"><div class="list-head"><div>取件码</div><div>地点 / 收件人</div><div>状态</div><div>录入时间</div><div>操作</div></div>${rows||'<div class="empty">这里还没有快递</div>'}</div></main></div>`}
function miniList(){let cards=filtered().map(p=>`<div class="pickup-card"><span class="pill ${p.status==='DONE'?'done':''}">${p.status==='DONE'?'已取件':'待取件'}</span><div class="code">${esc(p.pickupCode)}</div><div class="address">${esc(p.address)}</div><div class="meta" style="margin-top:8px">${esc(p.recipientName||'未填写收件人')} · ${p.source==='SMS'?'短信自动':'手工录入'} · ${esc(p.createdAt)}</div><div class="card-actions">${p.status==='PENDING'?`<button class="btn primary" onclick="event.stopPropagation();done('${p.id}')">标记已取</button>`:''}<button class="btn" onclick="openDetail('${p.id}')">详情</button></div></div>`).join('');return `<div class="mini-wrap"><div class="phone"><div class="phone-inner"><div class="phone-head"><button class="link logout" onclick="nav('identity')">退出登录</button><p class="kicker">窝事 · 家庭快递</p><h1>家里的快递</h1></div><div class="phone-body"><div class="toolbar">${tabs()}</div>${cards||'<div class="empty">这里还没有快递</div>'}</div><div class="phone-bottom"><button class="btn primary" onclick="modal='create';render()">＋ 录入快递</button></div></div></div></div>`}
function modalHtml(){if(!modal)return '';let p=data.find(x=>x.id===selected),body='';if(modal==='detail'&&p)body=`<h2>快递详情</h2><p>取件时核对地点与取件码。</p><div class="detail-line"><small>取件码</small><strong class="big">${esc(p.pickupCode)}</strong></div><div class="detail-line"><small>取件地点</small><strong>${esc(p.address)}</strong></div><div class="detail-line"><small>收件人</small><strong>${esc(p.recipientName||'未填写')}</strong></div><div class="detail-line"><small>录入来源</small><strong>${p.source==='SMS'?'短信自动录入':'手工录入'}</strong></div><div class="detail-line"><small>原始通知</small><strong>${esc(p.rawInfo||'未填写')}</strong></div><div class="detail-line"><small>状态 · 录入时间</small><strong>${p.status==='DONE'?'已取件':'待取件'} · ${esc(p.createdAt)}</strong></div><div class="actions"><button class="btn" onclick="modal=null;render()">关闭</button><button class="btn" onclick="modal='edit';render()">编辑</button>${p.status==='PENDING'?`<button class="btn primary" onclick="done('${p.id}')">标记已取件</button>`:''}</div>`;
if(modal==='create'||modal==='edit'){let v=modal==='edit'?p:{};body=`<h2>${modal==='edit'?'编辑快递':'录入快递'}</h2><p>地点和取件码为必填，其余信息可稍后补充。</p><form id="pickupForm" onsubmit="event.preventDefault();save()"><label class="field"><span>取件地点 *</span><input name="address" maxlength="200" required placeholder="例如：小区东门驿站" value="${esc(v.address||'')}"></label><label class="field"><span>取件码 *</span><input name="pickupCode" maxlength="80" required placeholder="例如：A-2681" value="${esc(v.pickupCode||'')}"></label><label class="field"><span>收件人</span><input name="recipientName" maxlength="80" placeholder="例如：妈妈" value="${esc(v.recipientName||'')}"></label><label class="field"><span>原始通知</span><textarea name="rawInfo" maxlength="4000" placeholder="可粘贴短信或微信通知">${esc(v.rawInfo||'')}</textarea></label><div class="actions"><button type="button" class="btn" onclick="modal=null;render()">取消</button><button class="btn primary" type="submit">保存快递</button></div></form>`}
if(modal==='code')body=`<h2>按取件码完成</h2><p>输入完整取件码，找到待取件的快递。</p><label class="field"><span>取件码</span><input id="codeEntry" placeholder="例如：A-2681"></label><div class="actions"><button class="btn" onclick="modal=null;render()">取消</button><button class="btn primary" onclick="byCode()">查找快递</button></div>`;
if(modal==='confirmCode'&&p)body=`<h2>确认已取件</h2><p>找到这条待取快递，请确认领取的是它。</p><div class="detail-line"><small>取件码</small><strong class="big">${esc(p.pickupCode)}</strong></div><div class="detail-line"><small>地点</small><strong>${esc(p.address)}</strong></div><div class="actions"><button class="btn" onclick="modal='code';render()">返回</button><button class="btn primary" onclick="done('${p.id}')">确认已取</button></div>`;
if(modal==='sms')body=`<h2>SMS 接入</h2><p>iOS 捷径收到短信后，通过受保护的 HTTPS 接口自动录入。</p><div class="detail-line"><small>示例记录</small><strong>今天 09:28 · 已创建快递 · A-2681</strong></div><div class="detail-line"><small>待审核时</small><strong>解析失败的短信留在管理端，由管理员核对后补录或重试。</strong></div><div class="hint">正式版由管理员配置独立接入密钥；本原型不展示密钥，也不发送短信。</div><div class="actions"><button class="btn" onclick="modal=null;render()">关闭</button></div>`;
if(modal==='members')body=`<h2>家庭成员</h2><p>此页在正式版由管理员维护白名单和微信绑定。</p><div class="hint">演示重点是快递流程。白名单拦截状态可在登录页查看。</div><div class="actions"><button class="btn" onclick="modal=null;render()">关闭</button></div>`;
return `<div class="overlay" onclick="if(event.target===this){modal=null;render()}"><div class="modal">${body}</div></div>`}
function render(){let host=$('#app');host.className=device==='web'?'web-view':'mobile-view';host.innerHTML=headerBar()+`<div class="stage">${device==='mini'?(screen==='list'?miniList():miniIdentity()):(screen==='login'||screen==='denied'?auth():webList())}</div>`+modalHtml()+(toastText?`<div class="toast">${esc(toastText)}</div>`:'')}
render();
</script></body></html>

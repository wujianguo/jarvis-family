name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: DATABASE_URL=postgresql://x:x@localhost:5432/x pnpm --filter @workspace/db generate
      - run: pnpm --filter @workspace/contracts typecheck && pnpm --filter @workspace/db typecheck && pnpm --filter api typecheck && pnpm --filter mini typecheck && pnpm --filter web typecheck
      - run: pnpm --filter mini build && pnpm --filter web build && pnpm --filter api build

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - uses: actions/checkout@v4
      - name: Build container images
        run: |
          docker build -f apps/api/Dockerfile -t "woshi-api:${GITHUB_SHA}" .
          docker build -f apps/web/Dockerfile -t "woshi-web:${GITHUB_SHA}" .
          docker save "woshi-api:${GITHUB_SHA}" "woshi-web:${GITHUB_SHA}" | gzip -1 > /tmp/woshi-images.tar.gz
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy to ECS
        run: |
          archive="/tmp/woshi-images-${GITHUB_SHA}.tar.gz"
          scp /tmp/woshi-images.tar.gz "ecs-user@101.200.151.162:${archive}"
          scp compose.yaml scripts/deploy-container.sh ecs-user@101.200.151.162:/home/ecs-user/woshi/
          ssh ecs-user@101.200.151.162 "bash /home/ecs-user/woshi/deploy-container.sh '${archive}' '${GITHUB_SHA}'"
          curl -fsS https://share.libms.top/family/api/health
          curl -fsS -o /dev/null https://share.libms.top/family/

  upload-mini:
    needs: checks
    runs-on: ubuntu-latest
    env:
      HAS_MINI_KEY: ${{ secrets.WECHAT_UPLOAD_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_MINI_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_MINI_KEY == 'true'
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        if: env.HAS_MINI_KEY == 'true'
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
        if: env.HAS_MINI_KEY == 'true'
      - run: pnpm --filter mini build
        if: env.HAS_MINI_KEY == 'true'
      - name: Upload mini program
        if: env.HAS_MINI_KEY == 'true'
        env:
          WECHAT_UPLOAD_PRIVATE_KEY: ${{ secrets.WECHAT_UPLOAD_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$WECHAT_UPLOAD_PRIVATE_KEY" > /tmp/woshi-upload.key
          trap 'rm -f /tmp/woshi-upload.key' EXIT
          WECHAT_UPLOAD_PRIVATE_KEY_PATH=/tmp/woshi-upload.key MINI_VERSION=0.0.${{ github.run_number }} pnpm --filter mini upload

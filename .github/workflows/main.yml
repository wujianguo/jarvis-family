name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: production
    env:
      HAS_MINI_KEY: ${{ secrets.WECHAT_UPLOAD_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: DATABASE_URL=postgresql://x:x@localhost:5432/x pnpm --filter @workspace/db generate
      - run: pnpm --filter @workspace/contracts typecheck && pnpm --filter @workspace/db typecheck && pnpm --filter api typecheck && pnpm --filter mini typecheck && pnpm --filter web typecheck
      - run: pnpm --filter mini build && pnpm --filter web build && pnpm --filter api build
      - name: Upload mini program
        if: ${{ env.HAS_MINI_KEY == 'true' }}
        env:
          WECHAT_UPLOAD_PRIVATE_KEY: ${{ secrets.WECHAT_UPLOAD_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$WECHAT_UPLOAD_PRIVATE_KEY" > /tmp/woshi-upload.key
          WECHAT_UPLOAD_PRIVATE_KEY_PATH=/tmp/woshi-upload.key MINI_VERSION=0.0.${{ github.run_number }} pnpm --filter mini upload
          rm -f /tmp/woshi-upload.key
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy to ECS
        run: |
          release="/home/ecs-user/woshi/releases/${GITHUB_SHA}"
          ssh ecs-user@101.200.151.162 "mkdir -p '$release'"
          tar -czf /tmp/woshi-release.tar.gz --exclude='*/node_modules' --exclude='apps/mini/dist' --exclude='apps/mini/.swc' --exclude='apps/web/.next/cache' apps packages scripts package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json tsconfig.json .npmrc .gitignore
          scp /tmp/woshi-release.tar.gz ecs-user@101.200.151.162:/tmp/woshi-release.tar.gz
          ssh ecs-user@101.200.151.162 "tar -xzf /tmp/woshi-release.tar.gz -C '$release'"
          ssh ecs-user@101.200.151.162 "bash '$release/scripts/deploy-remote.sh' '$release'"
          curl -fsS https://share.libms.top/family/api/health

name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: DATABASE_URL=postgresql://x:x@localhost:5432/x pnpm --filter @workspace/db generate
      - run: pnpm --filter @workspace/contracts typecheck && pnpm --filter @workspace/db typecheck && pnpm --filter api typecheck && pnpm --filter web typecheck
      - run: pnpm --filter web build && pnpm --filter api build

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - uses: actions/checkout@v4
      - name: Build container images
        run: |
          docker build -f apps/api/Dockerfile -t "woshi-api:${GITHUB_SHA}" .
          docker build -f apps/web/Dockerfile -t "woshi-web:${GITHUB_SHA}" .
          docker save "woshi-api:${GITHUB_SHA}" "woshi-web:${GITHUB_SHA}" | gzip -1 > /tmp/woshi-images.tar.gz
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy to ECS
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
        run: |
          : "${DEPLOY_HOST:?Set DEPLOY_HOST repository variable}"
          : "${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN repository variable}"
          : "${PUBLIC_API_BASE:?Set PUBLIC_API_BASE repository variable}"
          archive="/tmp/woshi-images-${GITHUB_SHA}.tar.gz"
          scp /tmp/woshi-images.tar.gz "ecs-user@${DEPLOY_HOST}:${archive}"
          scp compose.yaml scripts/deploy-container.sh "ecs-user@${DEPLOY_HOST}:/home/ecs-user/woshi/"
          ssh "ecs-user@${DEPLOY_HOST}" "bash /home/ecs-user/woshi/deploy-container.sh '${archive}' '${GITHUB_SHA}'"
          curl -fsS "${PUBLIC_API_BASE%/}/health"
          curl -fsS -o /dev/null "${PUBLIC_ORIGIN%/}/family/"
